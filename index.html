<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Autonomous Neuroevolution Simulation — Self-Driving Intelligence</title>
        <meta name="description" content="State-of-the-art neuroevolution autonomous driving simulation with real-time neural network visualizer, physics engine, and evolutionary controls.">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="simContainer">
            <div id="carPanel">
                <canvas id="carCanvas"></canvas>
            </div>
            <div id="networkPanel">
                <canvas id="networkCanvas"></canvas>
            </div>
        </div>

        <!-- Floating HUD Panel -->
        <div id="hud">
            <div id="infoPanel">
                <span id="genDisplay">Generation: 1</span>
                <span id="aliveDisplay">Alive: 500 / 500</span>
                <span id="bestDistDisplay">Best ever: 0m  |  This gen: 0m</span>
            </div>

            <!-- Clarified & Explicitly Labeled Storage Actions -->
            <div id="storageButtons">
                <button class="btn" title="Save best model to browser local storage" onclick="saveBrain()">💾 Save (Browser)</button>
                <button class="btn btn-danger" title="Clear saved models & restart Gen 1 from scratch" onclick="resetBrain()">🗑 Reset Storage</button>
                <button class="btn" title="Download best model as JSON file to disk" onclick="exportBrainJSON()">📤 Export File</button>
                <button class="btn" title="Load model from JSON file into current population" onclick="document.getElementById('importFile').click()">📥 Import File</button>
                <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importBrainJSON(event)">
            </div>

            <!-- Toast notification for storage events -->
            <div id="toastNotification" class="toast hidden"></div>

            <div id="legend">
                <div class="legend-item">
                    <span class="legend-swatch" style="background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
                    <span>Elite Model (Best)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch" style="background: rgba(139, 92, 246, 0.5);"></span>
                    <span>Mutant Swarm (500)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-swatch" style="background: #ef4444;"></span>
                    <span>Traffic Obstacles</span>
                </div>
            </div>
        </div>

        <!-- Simulation Controls Bar -->
        <div id="controlsBar">
            <button class="btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
            <button class="btn" id="nextGenBtn" onclick="forceNextGeneration()" title="Force advance to the next generation">⏭ Next Gen</button>

            <div class="control-group">
                <label for="simSpeed">Speed</label>
                <input type="range" id="simSpeed" min="1" max="10" value="1" step="1">
                <span id="speedLabel" class="value-badge">1×</span>
            </div>

            <div class="control-group">
                <label for="mutationSpeed">Mutation</label>
                <input type="range" id="mutationSpeed" min="0.01" max="0.5" value="0.1" step="0.01">
                <span id="mutationLabel" class="value-badge">10%</span>
            </div>
        </div>

        <!-- Scripts -->
        <script src="utils.js?v=4"></script>
        <script src="network.js?v=4"></script>
        <script src="networkVisualizer.js?v=4"></script>
        <script src="sensor.js?v=4"></script>
        <script src="road.js?v=4"></script>
        <script src="controls.js?v=4"></script>
        <script src="car.js?v=4"></script>
        <script src="main.js?v=4"></script>
    </body>
</html>
